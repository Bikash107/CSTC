<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSTC — New Ticket</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="dash-layout">

    <aside class="dash-sidebar">
      <div class="dash-logo">CSTC</div>
      <nav class="dash-nav">
        <a href="customerdashboard.html" class="dash-nav-link">My Tickets</a>
        <a href="createTicket.html" class="dash-nav-link active">New Ticket</a>
        <a href="#" class="dash-nav-link">Profile</a>
      </nav>
      <a href="login.html" class="dash-logout">Log out</a>
    </aside>

    <main class="dash-main">

      <div class="dash-topbar">
        <div>
          <h1>New Ticket</h1>
          <p>Tell us what's going wrong — we'll get an agent on it</p>
        </div>
      </div>

      <form class="ticket-form-card" id="createTicketForm">

        <div class="form-group">
          <label>Subject</label>
          <input type="text" placeholder="Brief summary of the issue" required>
        </div>

        <div class="form-row-2col">
          <div class="form-group">
            <label>Category</label>
            <select required>
              <option value="">Select category</option>
              <option value="billing">Billing</option>
              <option value="technical">Technical</option>
              <option value="general">General</option>
            </select>
          </div>

          <div class="form-group">
            <label>Priority</label>
            <select required>
              <option value="">Select priority</option>
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
              <option value="urgent">Urgent</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>Description</label>
          <textarea rows="6" placeholder="Describe the issue in detail..." required></textarea>
        </div>

        <div class="form-group">
          <label>Attachment (optional)</label>
          <input type="file">
        </div>

        <button type="submit" class="btn btn-primary">Submit Ticket</button>
      </form>

    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
