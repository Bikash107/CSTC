<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSTC — Agent Queue</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="dash-layout">

    <aside class="dash-sidebar">
      <div class="dash-logo">CSTC</div>
      <nav class="dash-nav">
        <a href="agentdashboard.html" class="dash-nav-link active">My Queue</a>
        <a href="#" class="dash-nav-link">Unassigned</a>
        <a href="#" class="dash-nav-link">Profile</a>
      </nav>
      <a href="login.html" class="dash-logout">Log out</a>
    </aside>

    <main class="dash-main">

      <div class="dash-topbar">
        <div>
          <h1>My Queue</h1>
          <p>Tickets assigned to you, sorted by priority</p>
        </div>
        <span class="agent-badge">RS</span>
      </div>

      <div class="stats-row">
        <div class="stat-card">
          <span class="stat-num">7</span>
          <span class="stat-label">Assigned to me</span>
        </div>
        <div class="stat-card">
          <span class="stat-num">2</span>
          <span class="stat-label">SLA breach risk</span>
        </div>
        <div class="stat-card">
          <span class="stat-num">14</span>
          <span class="stat-label">Resolved this week</span>
        </div>
      </div>

      <div class="filter-tabs">
        <button class="filter-btn active">All</button>
        <button class="filter-btn">Urgent</button>
        <button class="filter-btn">High</button>
        <button class="filter-btn">Medium</button>
        <button class="filter-btn">Low</button>
      </div>

      <div class="ticket-list" id="ticketList">
        <p class="loading-text">Loading queue...</p>
      </div>

    </main>

  </div>

  <div class="toast" id="toast"></div>

  <script src="script.js"></script>
</body>
</html>
