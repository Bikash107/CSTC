<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSTC — Log in</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="auth-page">
    <div class="auth-card">

      <div class="auth-logo">CSTC</div>

      <div class="auth-tabs">
        <button class="tab-btn active" id="loginTab">Log in</button>
        <button class="tab-btn" id="registerTab">Register</button>
      </div>

      <!-- LOGIN FORM -->
      <form class="auth-form" id="loginForm">

        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required>
        </div>

        <div class="form-row">
          <label class="checkbox-label">
            <input type="checkbox"> Remember me
          </label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary auth-submit">Log in</button>
      </form>

      
      <form class="auth-form hidden" id="registerForm">

        <div class="form-group">
          <label for="regName">Full name</label>
          <input type="text" id="regName" placeholder="Bikash Sutradhar" required>
        </div>

        <div class="form-group">
          <label for="regEmail">Email</label>
          <input type="email" id="regEmail" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label for="regPassword">Password</label>
          <input type="password" id="regPassword" placeholder="••••••••" required>
        </div>

        <div class="form-group">
          <label for="regConfirm">Confirm password</label>
          <input type="password" id="regConfirm" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary auth-submit">Create account</button>
      </form>

      <p class="auth-footer-note">
        By continuing, you agree to CSTC's Terms & Privacy Policy.
      </p>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
