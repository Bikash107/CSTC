services:
  - type: web
    name: cstc
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false   # You must set this manually in Render dashboard
      - key: JWT_SECRET
        sync: false   # You must set this manually in Render dashboard
